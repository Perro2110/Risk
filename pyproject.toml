[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["src/Risk/**"]

[tool.hatch.build.targets.wheel]
packages = ["src/Risk"]

[project]
name = "risk"
version = "0.1.0"
description = "A Risk project for the Data Science course"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyQt5",
    "shapely",
    "cycler==0.12.1",
    "fonttools==4.62.1",
    "kiwisolver==1.5.0",
    "markdown-it-py==4.0.0",
    "matplotlib==3.10.9",
    "mdurl==0.1.2",
    "multipledispatch==1.0.0",
    "numpy==2.4.4",
    "packaging==26.2",
    "pillow==12.2.0",
    "Pygments==2.20.0",
    "pyparsing==3.3.2",
    "python-dateutil==2.9.0.post0",
    "rich==15.0.0",
    "scipy==1.17.1",
    "six==1.17.0"
]