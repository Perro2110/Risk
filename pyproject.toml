[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["src/Risk/**"]

[tool.hatch.build.targets.wheel]
packages = ["src/Risk"]

[project]
name = "risk"
version = "0.1.0"
description = "A Risk project for the Data Science course"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "multipledispatch>=1.0",
    "matplotlib",
    "rich"
]